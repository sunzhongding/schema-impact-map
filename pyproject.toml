[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "schema-impact-map"
dynamic = ["version"]
description = "Interactive relational schema map with impact highlighting for proposed changes."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "sunzhongding"}]
keywords = ["database", "schema", "data-lineage", "impact-analysis", "visualization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Software Development :: Documentation",
]
dependencies = [
  "sqlglot>=25",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mcp>=2.0"]
mcp = ["mcp>=2.0"]

[project.urls]
Homepage = "https://github.com/sunzhongding/schema-impact-map"
Repository = "https://github.com/sunzhongding/schema-impact-map"
Issues = "https://github.com/sunzhongding/schema-impact-map/issues"

[project.scripts]
schema-impact-map = "schema_impact_map.cli:main"

[tool.hatch.version]
path = "src/schema_impact_map/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/schema_impact_map"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
